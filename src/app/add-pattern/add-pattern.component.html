<div class="scrollable-div overflow-auto" id="scroll-div">
  <h1 class="title">Add a new pattern</h1>
  <form (ngSubmit)="submitForm()" #patternForm="ngForm">
    <div class="container">
      <!-- name & category -->
      <div class="row">
        <div class="col-12 col-md-6 col-lg-5 col-xl-4">
          <label class="form-label">Pattern name *</label><br>
          <input type="text" class="appInput" name="patternName" id="name-input"
            [(ngModel)]="patternName" required placeholder="Calliope">
        </div>
        <div class="col-12 col-md-6 col-lg-5 col-xl-4">
          <label class="form-label">Category</label><br>
          <select name="category" class="appInput">
            <option *ngFor="let key of categoryKeys" [value]="key">{{key}}</option>
          </select>
        </div>
      </div>
      <div class="row ">
        <div class="col-12 col-md-6 col-lg-5 col-xl-4">
          <label class="form-label mt-4">Photos</label>
          <div class="drop-area" (drop)="onFileDrop($event)" (dragover)="allowDrop($event)" >
            Drag & <br> Drop Files Here
          </div>
        </div>
        <div class="col">a</div>
      </div>
      <div class="row ">
        <div class="col-12 col-md-6 col-lg-5 col-xl-4">
          <label class="form-label mt-4">Technical drawings</label>
          <div class="drop-area" (drop)="onFileDrop($event)" (dragover)="allowDrop($event)" >
            Drag & <br>Drop Files Here
          </div>
        </div>
        <div class="col">a</div>
      </div>
      <div class="row ">
        <div class="col-12 col-md-6 col-lg-5 col-xl-4">
          <label class="form-label mt-4">Pattern files *</label>
          <div class="drop-area" (drop)="onFileDrop($event)" (dragover)="allowDrop($event)" >
            Drag & <br>Drop Files Here
          </div>
        </div>
        <div class="col">a</div>
      </div>
    </div>
    <button class="btn btn-outline-dark align-self-end justify-self-center" type="submit" [disabled]="patternForm.invalid">Submit</button>
  </form>
</div>
