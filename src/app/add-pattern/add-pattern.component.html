<form (ngSubmit)="submitForm()" #patternForm="ngForm">
<div class="scrollable-div overflow-auto" id="add-pattern-main-div">
  <h1 class="title">Add a new pattern</h1>
  
    <div class="container">
      <!-- name & category -->
      <div class="row">
        <div class="col-12 col-md-6 col-lg-5 col-xl-4">
          <label class="form-label inputLabel">Pattern name *</label><br>
          <input type="text" class="inputField form-control" name="patternName" id="name-input"
            [(ngModel)]="pattern.name" required placeholder="Calliope">
        </div>
        <div class="col-12 col-md-6 col-lg-5 col-xl-4">
          <label class="form-label inputLabel">Category</label><br>

          <select name="category" class="form-select inputField form-control"  [(ngModel)]="pattern.category">
            <!-- <option *ngFor="let key of categoryKeys" [value]="key">{{key}}</option> -->
            <option value="top">top</option>
            <option value="bottom">bottom</option>
            <option value="dress">dress</option>
            <option value="one piece">one piece</option>
            <option value="accesory">accesory</option>
            <option value="else">else</option>
          </select>
        </div>
      </div>
      <div class="row ">
        <!-- PHOTOS DROPBOX -->
        <div class="col">
          <label class="form-label mt-4 inputLabel">Photos</label>
          <div class="drop-area " (drop)="onFileDrop($event, 'photos')" (dragover)="allowDrop($event)" >
            <mat-grid-list *ngIf="!pattern.photos.length" cols="1" rowHeight="1:1">
              <mat-grid-tile>
                Drag & Drop<br> Files Here
              </mat-grid-tile>
            </mat-grid-list>
            <mat-grid-list *ngIf="pattern.photos.length" cols="3" gutterSize="5" rowHeight="1:1">
              <mat-grid-tile *ngFor="let item of pattern.photos" >
                <fa-icon [icon]='xmark' size="sm" class="deleteButton" (click)="deleteItem(0, item)"></fa-icon>
                <img [src]="item" alt="photo"  class="imagePattern">
              </mat-grid-tile>
            </mat-grid-list>
          </div>
        </div>
        <!-- TECHNICAL DRAWINGS DROPBOX -->
        <div class="col">
          <label class="form-label mt-4 inputLabel">Technical drawings</label>
          <div class="drop-area" (drop)="onFileDrop($event, 'techDrawings')" (dragover)="allowDrop($event)" >
            <mat-grid-list *ngIf="!pattern.techDrawings.length" cols="1" rowHeight="1:1">
              <mat-grid-tile>
                Drag & Drop<br> Files Here
              </mat-grid-tile>
            </mat-grid-list>
            <mat-grid-list *ngIf="pattern.techDrawings.length" cols="3" gutterSize="5" rowHeight="1:1">
              <mat-grid-tile *ngFor="let item of pattern.techDrawings">
                <fa-icon [icon]='xmark' class="deleteButton" size="sm" (click)="deleteItem(1, item)"></fa-icon>
                <img [src]="item" alt="techDrawing"  class="imagePattern">
              </mat-grid-tile>
            </mat-grid-list>
          </div>
        </div>
        <!-- PATTERN FILES DROPBOX -->
        <div class="col">
          <label class="form-label mt-4 inputLabel">Pattern files *</label>
          <div class="drop-area scrollable-div overflow-auto" (drop)="onFileDrop($event, 'files')" (dragover)="allowDrop($event)" >
            <mat-grid-list *ngIf="!pattern.files.length" cols="1" rowHeight="1:1">
              <mat-grid-tile>
                Drag & Drop<br> Files Here
              </mat-grid-tile>
            </mat-grid-list>
            <mat-grid-list *ngIf="pattern.files.length" cols="4" gutterSize="5" rowHeight="1:1">
              <div *ngFor="let item of pattern.files; index as i;">
                <mat-grid-tile [colspan]="1" [rowspan]="1">
                  <fa-icon [icon]='pdf' size="xl"></fa-icon>
                </mat-grid-tile>
                <mat-grid-tile [colspan]="3" [rowspan]="1">
                  <a>{{extractFileName(item)}}</a>
                  <fa-icon [icon]='xmark' class="deleteFileButton" size="sm" (click)="deleteItem(2, item)"></fa-icon>
                </mat-grid-tile>
              </div>  
            </mat-grid-list>
          </div>
        </div>
      </div>
     </div>
    <!-- <button class="btn btn-outline-dark align-self-end justify-self-center" type="submit" [disabled]="patternForm.invalid">Submit</button> -->
  
</div>
<div class="modal-footer">
  <button type="button" class="secondary-button" (click)="closeModal()">cancel</button>
  <button type="button" class="button"  type="submit" [disabled]="patternForm.invalid">add pattern</button>
</div>
</form>
