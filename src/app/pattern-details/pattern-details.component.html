<!-- carousel -->
<div>
    <mdb-carousel [controls]="true" [indicators]="true" >
        @for (photo of pattern?.photos; track photo) {
          <mdb-carousel-item>
            <img
                style="height: 400px; object-fit: contain;"
                [src]="photo"
                class="d-block w-100"
                alt="..."
            />
          </mdb-carousel-item>
        }
        @for (photo of pattern?.techDrawings; track photo) {
            <mdb-carousel-item>
                <img
                style="height: 400px; object-fit: contain;"
                [src]="photo"
                class="d-block w-100"
                alt="..."
                />
            </mdb-carousel-item>
        }

      </mdb-carousel>
</div>
<!-- end of carousel -->

<!-- pattern content -->
<div style="padding: 20px;">
    <h5 style="color: grey; margin-bottom: -3px;margin-top: 5px;">{{pattern?.category}}</h5>
    <div class="pattern-header d-flex flex-row">
        <h3>{{pattern?.name}}</h3>
    </div>

    <!-- files -->
    <div class="container-fluid" style="margin-top: 20px;">
        <div class="row justify-content-center">
            <div class="col-8">
                <h5 style="margin-left: 15px;">Files</h5>
                @for (file of pattern?.files; track file) {
                    <div class="file-block d-flex flex-row align-items-center justify-content-between">
                        <div class="d-flex flex-row">
                            <fa-icon [icon]='fileIcon' style="margin-right: 12px;"></fa-icon>
                            {{file.split("\\").pop()}}
                        </div>

                        <button class="justify-self-end button"
                                (click)="data.openFile(file)">open</button>
                    </div>
                }
            </div>
        </div>
    </div>

</div>
