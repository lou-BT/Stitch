<form (ngSubmit)="submitForm()" #editPatternForm="ngForm">
    <div class="scrollable-div overflow-auto" id="pattern-edit-main-div">
        <h1 class="title">{{newPattern.name}}</h1>
        <div class="container">
          <label class="form-label inputLabel">Category</label><br>
          <select name="category" class="form-select inputField form-control"  [(ngModel)]="newPattern.category">
            <!-- <option *ngFor="let key of categoryKeys" [value]="key">{{key}}</option> -->
            <option value="top">top</option>
            <option value="bottom">bottom</option>
            <option value="dress">dress</option>
            <option value="one piece">one piece</option>
            <option value="accessory">accessory</option>
            <option value="else">else</option>
          </select>

          <label class="form-label inputLabel" style="margin-top: 1.5rem!important;">Photos</label><br>
          <div *ngFor="let photo of newPattern.photos; let i = index" class="image-block d-flex flex-row align-items-center justify-content-between">
            <div class="d-flex flex-row align-items-center">
              <div class="image-container">
                <img [src]="photo" alt="Photo">
              </div>
              <span style="margin-left: 10px">{{photo.split("\\").pop()}}</span>
            </div>
            <button class="justify-self-end button" style="margin-right: 13px;" (click)="removeItem(0,i)">delete</button>
          </div>
          <div *ngFor="let photo of patternEdit.newPhotos; let i = index" class="image-block d-flex flex-row align-items-center justify-content-between">
            <div class="d-flex flex-row align-items-center">
              <div class="image-container">
                <img [src]="photo" alt="Photo">
              </div>
              <span style="margin-left: 10px">{{photo.split("\\").pop()}}</span>
            </div>
            <button class="justify-self-end button" style="margin-right: 13px;" (click)="removeNewItem(0,i)">delete</button>
          </div>
          <div class="new-item-block d-flex align-items-center justify-content-center" 
               (drop)="onFileDrop($event, 0)" (dragover)="allowDrop($event)">
            <fa-icon [icon]='plusIcon'  style="color:gray"></fa-icon>
          </div>

          <label class="form-label inputLabel" style="margin-top: 1.5rem!important;">Technical drawings</label><br>
          <div *ngFor="let drawing of newPattern.techDrawings; let i = index" class="image-block d-flex flex-row align-items-center justify-content-between">
            <div class="d-flex flex-row align-items-center">
              <div class="image-container">
                <img [src]="drawing" alt="Photo">
              </div>
              <span style="margin-left: 10px">{{drawing.split("\\").pop()}}</span>
            </div>
            <button class="justify-self-end button" style="margin-right: 13px;" (click)="removeItem(1,i)">delete</button>
          </div>
          <div *ngFor="let drawing of patternEdit.newTechDrawings; let i = index" class="image-block d-flex flex-row align-items-center justify-content-between">
            <div class="d-flex flex-row align-items-center">
              <div class="image-container">
                <img [src]="drawing" alt="Photo">
              </div>
              <span style="margin-left: 10px">{{drawing.split("\\").pop()}}</span>
            </div>
            <button class="justify-self-end button" style="margin-right: 13px;" (click)="removeNewItem(1,i)">delete</button>
          </div>
          <div class="new-item-block d-flex align-items-center justify-content-center" 
                (drop)="onFileDrop($event, 1)" (dragover)="allowDrop($event)">
            <fa-icon [icon]='plusIcon'  style="color:gray"></fa-icon>
          </div>

          <label class="form-label inputLabel" style="margin-top: 1.5rem!important;">Files</label><br>
          <div *ngFor="let file of newPattern.files; let i = index" class="file-block d-flex flex-row align-items-center justify-content-between">
            <div class="d-flex flex-row align-items-center">
              <fa-icon [icon]='fileIcon'  style="margin-right: 12px;"></fa-icon>
              <span style="margin-left: 10px">{{file.split("\\").pop()}}</span>
            </div>
            <button class="justify-self-end button" style="margin-right: 13px;" (click)="removeItem(2,i)">delete</button>
          </div>
          <div *ngFor="let file of patternEdit.newFiles; let i = index" class="file-block d-flex flex-row align-items-center justify-content-between">
            <div class="d-flex flex-row align-items-center">
              <fa-icon [icon]='fileIcon'  style="margin-right: 12px;"></fa-icon>
              <span style="margin-left: 10px">{{file.split("\\").pop()}}</span>
            </div>
            <button class="justify-self-end button" style="margin-right: 13px;" (click)="removeNewItem(2,i)">delete</button>
          </div>
        
          <div class="new-item-block d-flex align-items-center justify-content-center" 
                (drop)="onFileDrop($event, 2)" (dragover)="allowDrop($event)">
            <fa-icon [icon]='plusIcon'  style="color:gray"></fa-icon>
          </div>
        </div>


    </div>
    <div class="modal-footer">
        <button type="button" class="subtle-warning-button"  type="submit" (click)="deletePattern()" data-bs-dismiss="modal">delete pattern</button>
        <button type="button" class="action-button"  type="submit" (click)="testFunction()">save</button>
        <button type="button" class="button" data-bs-dismiss="modal" (click)="closeModal()">cancel</button>
        
      </div>
</form>
